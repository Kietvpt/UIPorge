name: Publish UIForge Packages to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # =================================================================
  # 1. Publish .NET 8 NuGet Package (UIForge.Core)
  # =================================================================
  publish-nuget:
    name: Build & Push NuGet Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || '1.0.0' }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved NuGet version: $VERSION"

      - name: Restore & Pack NuGet Package
        run: |
          dotnet restore backend/UIForge.Core/UIForge.Core.csproj -p:PackageVersion=${{ steps.ver.outputs.version }}
          dotnet pack backend/UIForge.Core/UIForge.Core.csproj \
            --no-restore \
            --configuration Release \
            --output ./nuget-artifacts \
            -p:PackageVersion=${{ steps.ver.outputs.version }}

      - name: Push to GitHub Packages NuGet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          dotnet nuget push ./nuget-artifacts/*.nupkg \
            --source "github" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

  # =================================================================
  # 2. Publish npm Package (@<owner>/uiforge-core)
  # =================================================================
  publish-npm:
    name: Build & Push npm Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'

      - name: Resolve Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || '1.0.0' }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved npm version: $VERSION"

      - name: Install Dependencies
        run: npm ci

      - name: Update Package Version & Scope
        run: |
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            pkg.name = '@${OWNER_LOWER}/uiforge-core';
            pkg.private = false;
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
          "
          echo "@${OWNER_LOWER}:registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Build Core Library
        run: npm run build:lib

      - name: Publish to GitHub Packages npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
