version: '3.8'

services:
  # =================================================================
  # 1. DATABASE: PostgreSQL 16 Alpine (Default - Lightweight ~150MB)
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: uiforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uiforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-uiforge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-UIForge_Secure_Pass_2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uiforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uiforge_admin} -d ${POSTGRES_DB:-uiforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =================================================================
  # OPTIONAL DATABASE: Microsoft SQL Server 2022
  # Run with: docker compose --profile sqlserver up -d
  # =================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: uiforge-sqlserver
    restart: unless-stopped
    profiles:
      - sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-UIForge_SA_StrongPassword_2026!}
      MSSQL_PID: "Express"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - uiforge-network

  # =================================================================
  # 2. BACKEND: UIForge .NET 8 Web API
  # =================================================================
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: uiforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:5048"
      Database__Provider: ${DB_PROVIDER:-PostgreSQL}
      # Connection String for PostgreSQL (Default):
      ConnectionStrings__PostgreSQLConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-uiforge_db};Username=${POSTGRES_USER:-uiforge_admin};Password=${POSTGRES_PASSWORD:-UIForge_Secure_Pass_2026!}"
      # Connection String for SQL Server (used when DB_PROVIDER=SqlServer with --profile sqlserver):
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=UIPorge_BetaV1;User Id=sa;Password=${MSSQL_SA_PASSWORD:-UIForge_SA_StrongPassword_2026!};TrustServerCertificate=True;MultipleActiveResultSets=True;"
      Jwt__Key: ${JWT_KEY:-UIForge_Super_Secret_Key_For_Jwt_Authentication_Must_Be_At_Least_32_Chars_Long_2026!}
      Jwt__Issuer: ${JWT_ISSUER:-UIForgeAPI}
      Jwt__Audience: ${JWT_AUDIENCE:-UIForgeClient}
      Cors__AllowedOrigins: ${ALLOWED_ORIGINS:-https://demo.uiforge.dev,http://localhost:3000}
    networks:
      - uiforge-network

  # =================================================================
  # 3. FRONTEND: UIForge Client Demo (Vite SPA + Nginx)
  # =================================================================
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.uiforge.dev}
    container_name: uiforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - uiforge-network

  # =================================================================
  # 4. REVERSE PROXY & AUTOMATIC SSL: Caddy Server
  # =================================================================
  caddy:
    image: caddy:2-alpine
    container_name: uiforge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-demo.uiforge.dev}
      API_DOMAIN: ${API_DOMAIN:-api.uiforge.dev}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.uiforge.dev}
      ACME_EMAIL: ${ACME_EMAIL:-admin@uiforge.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - uiforge-network

networks:
  uiforge-network:
    driver: bridge

volumes:
  postgres_data:
  sqlserver_data:
  caddy_data:
  caddy_config:
